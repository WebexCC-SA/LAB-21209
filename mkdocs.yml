---
site_name: "LAB-21209: Build Webex AI Agents with Your Own Custom LLM" # This must begin with the session ID, e.g. LABXXX-1234 This is my Cisco Live Lab
site_description: Build Webex AI Agents with Your Own Custom LLM # must be same as "site_name"
site_author: Mykola Danylchuk
copyright: Copyright &copy; 2025 Cisco
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.integrate
  custom_dir: docs/overrides
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: template_assets/webexLogo91.png
  favicon: template_assets/webex75.png
extra:
  generator: false
  repo: "https://github.com/WebexCC-SA/LAB-21209.git"
  site_event: test
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - template_assets/js/newLoad.js
  - template_assets/js/setInfo.js
plugins:
  - search
  - macros
  # - with-pdf:
  #     cover_title: LABXXX-1234
  #     cover_subtitle: My famous WebexOne Lab
  #     cover_logo: template_assets/wx1Splash_new.gif
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      skip_classes:
      - custom-skip-class-name
      auto_caption: true
      caption_position: top
markdown_extensions:
  - md_in_html
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
      
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Getting Started:
      - Overview: ./main/overview.md
      - Access your Environment: ./main/PreRequisites.md
      - Conclusion: conclusion.md
  - Configure Autonomous AI Agent:
      - Autonomous AI Agent:
          - Guide:
              - "Overview": ./main/AI_Lab_Overview.md
              - "Mission 1: Create AI Autonomous Agent": ./main/AIAgentTrack_Mission1.md
              - "Mission 2: Integrating the AI Agent with Flow for Voice Calls": ./main/AI_Lab_Aut_MissionX.md
              - "Mission 3: Configure Fulfillment Using Voice Flow": ./main/AI_Lab_Aut_Voice_Flow_Fulfillment.md
          - Conclusion: ./main/AI_Lab_Aut_Conclusion.md
  - Bring Your Own LLM:
      - Overview: ./main/BYO_LLM_Overview.md
  - Bonus - Integrate MCP Server:
      - Guide:
          - "Overview": ./main/MCP_Server_Overview.md
          - "Configure Action with MCP": ./main/AI_Lab_Aut_Mission_MCP.md
      - Conclusion: ./main/MCP_Server_Conclusion.md
 